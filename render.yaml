services:
  - type: web
    name: lisatrendz-api
    runtime: node
    rootDir: server
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: lisatrendz-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: ADMIN_USER
        value: owner
      - key: ADMIN_PASS
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://lisatrendz.com,https://www.lisatrendz.com
      - key: PRODUCTS_DATA_PATH
        value: /var/data/products.json
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: PUBLIC_API_ORIGIN
        value: https://api.lisatrendz.com
      - key: PUBLIC_SITE_ORIGIN
        value: https://lisatrendz.com
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_CURRENCY
        value: GHS
      - key: PAYSTACK_CHANNELS
        value: card,mobile_money
      - key: SMS_ENABLED
        value: "true"
      - key: SMS_PROVIDER
        value: arkesel
      - key: SMS_DEFAULT_COUNTRY_CODE
        value: "+233"
      - key: SMS_BRAND_NAME
        value: LisaTrendz
      - key: ARKESEL_API_KEY
        sync: false
      - key: ARKESEL_SENDER_ID
        value: LisaTrendz
      - key: ARKESEL_CALLBACK_URL
        value: https://api.lisatrendz.com/api/sms/arkesel/delivery-report
